---
- name: Install hardening packages on Debian family
  ansible.builtin.apt:
    name:
      - fail2ban
      - unattended-upgrades
    state: present
    update_cache: true
  when: ansible_facts.os_family == 'Debian'

- name: Install hardening packages on Red Hat family
  ansible.builtin.dnf:
    name:
      - fail2ban
    state: present
  when: ansible_facts.os_family == 'RedHat'

- name: Install SSH hardening drop-in
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: "{{ ssh_config_path }}"
    owner: root
    group: root
    mode: '0644'
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Restart SSH

- name: Enable and start fail2ban
  ansible.builtin.service:
    name: "{{ fail2ban_service_name }}"
    enabled: true
    state: started

- name: Enable unattended upgrades on Debian family
  ansible.builtin.service:
    name: unattended-upgrades
    enabled: true
    state: started
  when:
    - ansible_facts.os_family == 'Debian'
    - enable_unattended_upgrades | bool

